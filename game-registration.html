<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Game Registration - Akhand Yogdan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>body{font-family:Arial;background:#f4f6fb;margin:0}.top-menu{background:#0d1b3e;position:sticky;top:0;z-index:10}.top-menu ul{display:flex;justify-content:center;list-style:none;flex-wrap:wrap}.top-menu a{color:#fff;text-decoration:none;padding:13px 15px;display:block;font-size:13px;font-weight:600}.top-menu a:hover{color:#ff6f00}.form-box{max-width:750px;margin:20px auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.1);border-top:5px solid #ff6f00}label{font-weight:700;font-size:13px;margin-top:10px;display:block}input,select,textarea{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-top:4px}.btn{width:100%;background:linear-gradient(90deg,#0d1b3e,#d32f2f);color:#fff;border:none;padding:13px;border-radius:8px;font-size:16px;font-weight:800;cursor:pointer;margin-top:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style>
</head><body>
<div class="top-menu"><ul><li><a href="https://akhandyogdan.in">HOME</a></li><li><a href="game-registration.html" style="background:#ff6f00">GAME REGISTRATION</a></li><li><a href="verify.html">VERIFY CERTIFICATE</a></li></ul></div>
<div class="form-box">
<h2 style="text-align:center;color:#0d1b3e">🏆 Game Competition Registration 2026</h2>
<div class="grid"><div><label>Player Name *</label><input id="pname"></div><div><label>Father Name</label><input id="fname"></div><div><label>DOB *</label><input type="date" id="dob"></div><div><label>Mobile *</label><input id="mobile"></div><div><label>Game *</label><select id="game"><option value="">Select</option><option>Kabaddi</option><option>Kho-Kho</option><option>Running</option><option>Long Jump</option><option>Volleyball</option><option>Chess</option><option>Drawing</option><option>Essay</option><option>Dance</option><option>Singing</option></select></div><div><label>Category</label><select id="cat"><option>Under 14</option><option>Under 18</option><option>Open</option></select></div></div>
<label>District</label><input id="dist" value="Sultanpur"><label>Address</label><textarea id="addr" rows="2"></textarea><label>WhatsApp</label><input id="wapp">
<button class="btn" onclick="register()">Submit & Get Roll No + Certificate</button>
<div id="result" style="margin-top:15px;display:none;background:#e8f5e9;padding:15px;border-radius:10px;text-align:center"></div>
<div id="qrcode" style="display:flex;justify-content:center;margin-top:10px"></div>
</div>
<script>
const SCRIPT_URL = "GOOGLE_SCRIPT_URL_YAHAN_DAALO";
async function register(){
 let data={Name:document.getElementById('pname').value,Father:document.getElementById('fname').value,DOB:document.getElementById('dob').value,Mobile:document.getElementById('mobile').value,WhatsApp:document.getElementById('wapp').value,District:document.getElementById('dist').value,Game:document.getElementById('game').value,Category:document.getElementById('cat').value,Address:document.getElementById('addr').value};
 if(!data.Name||!data.Mobile||!data.Game||!data.DOB){alert("Name, Mobile, Game, DOB zaruri hai");return}
 document.querySelector('.btn').innerText="Submitting...";
 let res=await fetch(SCRIPT_URL,{method:"POST",body:JSON.stringify(data)});let j=await res.json();
 document.getElementById('result').style.display='block';
 document.getElementById('result').innerHTML=`<h3 style="color:#2e7d32">✅ Registered!</h3><p><b>Roll No: ${j.rollNo}</b><br><b>Cert ID: ${j.certID}</b></p><p>Verify Link: https://akhandyogdan.in/verify.html?id=${j.certID}</p><button onclick="makePDF('${j.rollNo}','${j.certID}','${data.Name}','${data.Game}')" style="padding:8px 15px;background:#0d1b3e;color:#fff;border:none;border-radius:6px;cursor:pointer">📄 Download Certificate PDF</button>`;
 document.getElementById('qrcode').innerHTML=""; new QRCode(document.getElementById("qrcode"), `https://akhandyogdan.in/verify.html?id=${j.certID}`);
 document.querySelector('.btn').innerText="Submit & Get Roll No + Certificate";
}
function makePDF(roll, certID, name, game){
 const {jsPDF}=window.jspdf;let doc=new jsPDF('landscape');doc.setFillColor(13,27,62);doc.rect(0,0,297,210,'F');doc.setFillColor(255,255,255);doc.rect(4,4,289,202,'F');
 doc.setFontSize(20);doc.setTextColor(13,27,62);doc.text("AKHAND YOGDAN ASSOCIATION SULTANPUR",148,22,{align:"center"});doc.setFontSize(10);doc.setTextColor(211,47,47);doc.text("Reg. By Govt. Of India | Reg No: 233107 | akhandyogdan.in",148,30,{align:"center"});
 doc.setFontSize(26);doc.text("CERTIFICATE OF PARTICIPATION",148,50,{align:"center"});doc.setFontSize(14);doc.text(`This is to certify that Mr/Ms ${name}`,148,70,{align:"center"});doc.text(`Roll No: ${roll} has participated in ${game} Competition 2026`,148,80,{align:"center"});doc.setFontSize(11);doc.text(`Certificate ID: ${certID}`,148,95,{align:"center"});doc.text(`Verify at: https://akhandyogdan.in/verify.html?id=${certID}`,148,103,{align:"center"});doc.text("Er. Om Kumar Verma - Founder & Director",30,165);doc.text("Authorized Signature",230,165);doc.save(`Certificate-${roll}.pdf`);
}
</script></body></html>
