<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Results - Jindi Hindi GK Competition 2026 | Akhand Yogdan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Arial;background:#f0f2f5}
.top{background:#0d1b3e;color:#fff;text-align:center;padding:20px}
.top h1{font-size:22px}.top p{opacity:.8;margin-top:5px}
.box{background:#fff;max-width:900px;margin:20px auto;padding:20px;border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.1)}
input,select{width:100%;padding:13px;border:2px solid #ddd;border-radius:8px;font-size:16px;margin:8px 0}
.tabs{display:flex;gap:10px;margin:15px 0}
.tabs button{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer;font-weight:700;background:#e8eaf6}
.tabs button.active{background:#1a237e;color:#fff}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
th{background:#1a237e;color:#fff;padding:10px;text-align:left}
td{padding:10px;border-bottom:1px solid #eee}
tr:nth-child(even){background:#f9f9f9}
.rank1{background:#fff8e1!important;font-weight:700}
.badge{padding:3px 8px;border-radius:12px;color:#fff;font-size:11px}
.b1{background:#ff9800}.b2{background:#9e9e9e}.b3{background:#795548}
.toppers{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:15px 0}
.topper{background:linear-gradient(135deg,#fff3e0,#ffe0b2);padding:15px;border-radius:10px;text-align:center;border:2px solid #ff9800}
@media(max-width:600px){.toppers{grid-template-columns:1fr} table{font-size:12px}}
</style>
</head>
<body>
<div class="top">
<h1>🏆 Jindi Hindi GK Competition 2026 - Results</h1>
<p>Akhand Yogdan Avam Samaj Seva Sansthan | Total 102 Students</p>
</div>

<div class="box">
<input type="text" id="search" placeholder="🔍 Roll No. ya Naam se search karein... Example: AYAS-057 ya Vaibhav" onkeyup="filterData()">
<div class="tabs">
<button id="btn68" class="active" onclick="showGroup('6-8')">Class 6th - 8th (78 Students)</button>
<button id="btn912" onclick="showGroup('9-12')">Class 9th - 12th (24 Students)</button>
</div>
<div id="toppers"></div>
<div id="count" style="font-weight:700;color:#1a237e"></div>
<div style="overflow-x:auto"><table><thead><tr><th>Rank</th><th>Roll No.</th><th>Name</th><th>Class</th><th>Correct</th><th>Marks</th></tr></thead><tbody id="tbody"></tbody></table></div>
<p id="loading" style="text-align:center;padding:20px">Loading Results... Excel file load ho rahi hai</p>
</div>

<script>
let allData = [];
let currentGroup = '6-8';
async function loadExcel(){
  try{
    const res = await fetch('HINDI_Compitition_2026.xlsx');
    const buf = await res.arrayBuffer();
    const wb = XLSX.read(buf, {type:'array'});
    // 6-8th rankwise sheet
    let s1 = XLSX.utils.sheet_to_json(wb.Sheets['6-8th rankwise']);
    let s2 = XLSX.utils.sheet_to_json(wb.Sheets['Rankwise list 9-12th']);
    s1.forEach(r=> allData.push({group:'6-8', roll:r['Roll No.'], name:r['NAME OF STUDENTS'], cls:r['Class'], correct:r['Correct'], marks:parseFloat(r['Marks obt.']).toFixed(2), rank:r['Rank']}));
    s2.forEach(r=> allData.push({group:'9-12', roll:r['Roll No.'], name:r['NAME OF STUDENTS'], cls:r['Class'], correct:r['Correct'], marks:parseFloat(r['Marks obt.']).toFixed(2), rank:r['Rank']}));
    document.getElementById('loading').style.display='none';
    render();
  }catch(e){ document.getElementById('loading').innerHTML='Excel file nahi mili. HINDI_Compitition_2026.xlsx ko results.html ke saath same folder me daaliye.'; }
}
function showGroup(g){ currentGroup=g; document.getElementById('btn68').classList.toggle('active', g=='6-8'); document.getElementById('btn912').classList.toggle('active', g=='9-12'); render(); }
function filterData(){ render(); }
function render(){
  const q = document.getElementById('search').value.toLowerCase();
  let list = allData.filter(d=> d.group==currentGroup && (!q || d.roll.toLowerCase().includes(q) || d.name.toLowerCase().includes(q)));
  list.sort((a,b)=> a.rank-b.rank);
  document.getElementById('count').innerText = `Showing ${list.length} Results`;
  // Toppers - only when no search
  if(!q){
    let top3 = list.slice(0,3);
    document.getElementById('toppers').innerHTML = top3.map((t,i)=> `<div class="topper">🏅 ${i+1}${i==0?'st':i==1?'nd':'rd'} Rank<br><b>${t.name}</b><br>${t.roll} | ${t.cls}<br>${t.marks} Marks</div>`).join('');
  } else { document.getElementById('toppers').innerHTML=''; }
  document.getElementById('tbody').innerHTML = list.map(d=> `<tr class="${d.rank==1?'rank1':''}"><td><span class="badge ${d.rank==1?'b1':d.rank==2?'b2':d.rank==3?'b3':''}" style="${d.rank>3?'background:#1a237e':''}">${d.rank}</span></td><td>${d.roll}</td><td><b>${d.name}</b></td><td>${d.cls}</td><td>${d.correct}</td><td><b>${d.marks}</b></td></tr>`).join('');
}
loadExcel();
</script>
</body>
</html>
